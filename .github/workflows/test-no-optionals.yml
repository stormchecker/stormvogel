name: Test without optional dependencies

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl
          apt-get -y install git
          apt-get -y install nodejs
          apt-get -y install graphviz

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies (no optional group)
        run: uv sync --locked --no-default-groups --group test

      - name: Verify base import works
        run: uv run --no-sync python -c "import stormvogel"

      - name: Run tests
        run: uv run --no-sync pytest -vv
