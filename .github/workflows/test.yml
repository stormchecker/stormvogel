name: Test

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: python:3.13
    strategy:
      fail-fast: false
      matrix:
        deps: [pinned, latest]
    name: Test (${{ matrix.deps }} dependencies)
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get -y install curl git libcairo2-dev nodejs graphviz

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install pinned dependencies
        if: matrix.deps == 'pinned'
        run: uv sync --locked --no-default-groups --group test --all-extras

      - name: Install latest dependencies
        if: matrix.deps == 'latest'
        run: |
          uv lock --upgrade
          uv sync --locked --no-default-groups --group test --all-extras

      - name: Run tests
        run: uv run --no-sync pytest -vv --cov=stormvogel --cov-report=xml tests/
